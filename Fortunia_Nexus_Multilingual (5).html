function openModal(title,body){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="btn small" onclick="closeModal()">✕</button></div>${body}</section></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function openCaseModal(id=''){const c=casesData.find(x=>x.id===id)||{};openModal(id?t('editCaseTitle'):t('newCaseTitle'),`<form onsubmit="saveCase(event,'${id}')"><div class="form-grid"><div class="field full"><label>${t('caseName')} *</label><input name="name" required value="${esc(c.name||'')}"></div><div class="field"><label>${t('clientName')}</label><input name="client" value="${esc(c.client||'')}"></div><div class="field"><label>${t('caseCategory')}</label><select name="category"><option ${c.category==='Contract'?'selected':''}>Contract</option><option ${c.category==='Criminal'?'selected':''}>Criminal</option><option ${c.category==='Civil'?'selected':''}>Civil</option><option ${c.category==='Employment'?'selected':''}>Employment</option><option ${c.category==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>${t('caseStatus')}</label><select name="status"><option value="Open" ${c.status==='Open'?'selected':''}>${t('statusOpen')}</option><option value="In progress" ${c.status==='In progress'?'selected':''}>${t('statusProgress')}</option><option value="Closed" ${c.status==='Closed'?'selected':''}>${t('statusClosed')}</option></select></div><div class="field full"><label>${t('notes')}</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary">${t('save')}</button></div></form>`)}
function saveCase(e,id){e.preventDefault();const f=new FormData(e.target),old=casesData.find(c=>c.id===id);const item={id:id||crypto.randomUUID(),name:f.get('name').trim(),client:f.get('client').trim(),category:f.get('category'),status:f.get('status'),notes:f.get('notes').trim(),updated:new Date().toISOString().slice(0,10)};if(!item.name){toast(t('nameRequired'));return}if(old)Object.assign(old,item);else casesData.push(item);persist();closeModal();render();toast(t('caseSaved'))}
function editCase(id){openCaseModal(id)}
function removeCase(id){if(!confirm(t('deleteConfirm')))return;casesData=casesData.filter(c=>c.id!==id);persist();render();toast(t('deleted'))}
function filterCaseRows(q){const filtered=casesData.slice().reverse().filter(c=>[c.name,c.client,c.category,c.status,c.notes].join(' ').toLowerCase().includes(q.toLowerCase()));$('#casesTable').innerHTML=caseTable(filtered)}
function exportCSV(){const rows=[['Case','Client','Category','Status','Notes','Updated'],...casesData.map(c=>[c.name,c.client,c.category,c.status,c.notes,c.updated])];const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='fortunia-nexus-cases.csv';a.click();URL.revokeObjectURL(a.href)}
function openConsultModal(){openModal(t('consultFormTitle'),`<form onsubmit="saveConsult(event)"><div class="form-grid"><div class="field full"><label>${t('consultationName')} *</label><input name="name" required></div><div class="field full"><label>${t('consultationTopic')} *</label><input name="topic" required></div><div class="field"><label>${t('consultationDate')} *</label><input name="date" type="date" required></div><div class="field"><label>${t('consultationTime')}</label><input name="time" type="time"></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary">${t('save')}</button></div></form>`)}
function saveConsult(e){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name){toast(t('nameRequired'));return}consultData.push({id:crypto.randomUUID(),name,topic:f.get('topic').trim(),date:f.get('date'),time:f.get('time'),status:'Scheduled'});persist();closeModal();render();toast(t('consultSaved'))}
function cycleConsult(id){const c=consultData.find(x=>x.id===id);if(!c)return;c.status=({Scheduled:'Completed',Completed:'Cancelled',Cancelled:'Scheduled'})[c.status];persist();render();toast(t('saved'))}
function removeConsult(id){if(!confirm(t('deleteConfirm')))return;consultData=consultData.filter(c=>c.id!==id);persist();render();toast(t('deleted'))}
function analyzeDoc(){const text=$('#docText').value.trim();if(!text){toast(t('noText'));return}reviewed++;persist();const words=text.match(/\b[\p{L}\p{N}'’-]+\b/gu)||[],dict=[['termContract',/\b(contract|agreement|kontrak|perjanjian|contrato|acuerdo)\b/iu],['termLiability',/\b(liability|liable|tanggung jawab|tanggungjawab|responsabilidad)\b/iu],['termPayment',/\b(payment|payable|pembayaran|pembayaran|pago)\b/iu],['termTermination',/\b(termination|terminate|pengakhiran|pemutusan|terminación)\b/iu],['termConfidentiality',/\b(confidential|confidentiality|rahasia|kerahasiaan|confidencial)\b/iu],['termDeadline',/\b(deadline|within \d+ days|tenggat|jangka waktu|plazo)\b/iu]];const found=dict.filter(([k,re])=>re.test(text)).map(([k])=>t(k));$('#analysisResult').innerHTML=`<div class="grid stats" style="margin-top:18px"><div class="card"><div class="stat-foot">${t('wordCount')}</div><div class="stat-num">${words.length}</div></div><div class="card"><div class="stat-foot">${t('characters')}</div><div class="stat-num">${text.length}</div></div><div class="card"><div class="stat-foot">${t('keyTerms')}</div><div class="stat-num">${found.length}</div></div></div><div class="card"><h3>${t('analysisDone')}</h3><p>${found.length?found.map(esc).join(' · '):t('signalNoTerms')}</p><p class="sub">${found.length?t('signalTerms'):''}</p></div>`;toast(t('analysisDone'))}
function askPrompt(kind){const text=({contract:t('promptContract'),criminal:t('promptCriminal'),privacy:t('promptPrivacy')})[kind];$('#chatInput').value=text;sendChat()}
function sendChat(){const input=$('#chatInput');if(!input||!input.value.trim())return;const q=input.value.trim(),box=$('#chatMessages');box.insertAdjacentHTML('beforeend',`<div class="message user"><small>You</small>${esc(q)}</div>`);let answer;if(/contract|agreement|kontrak|perjanjian|contrato|acuerdo/i.test(q))answer=lang==='id'?'Dalam meninjau kontrak, periksa identitas para pihak, objek, hak dan kewajiban, pembayaran, jangka waktu, pengakhiran, kerahasiaan, penyelesaian sengketa, serta hukum yang berlaku. Cocokkan klausul dengan konteks dan peraturan yang berlaku.':lang==='es'?'Al revisar un contrato, comprueba las partes, el objeto, derechos y obligaciones, pagos, duración, terminación, confidencialidad, resolución de conflictos y ley aplicable. Verifica cada cláusula según el contexto y la legislación vigente.':'When reviewing a contract, check the parties, subject matter, rights and obligations, payment, term, termination, confidentiality, dispute resolution, and governing law. Review each clause in context and against current law.';
else if(/criminal|pidana|penal|culpability|pertanggungjawaban/i.test(q))answer=lang==='id'?'Secara umum, analisis hukum pidana dapat mencakup dasar hukum, unsur tindak pidana, sifat melawan hukum, kesalahan, kemampuan bertanggung jawab, alasan pembenar atau pemaaf, dan alat bukti. Unsur serta aturan tepatnya bergantung pada yurisdiksi dan tanggal peristiwa.':lang==='es'?'En general, el análisis penal puede incluir la base legal, los elementos del delito, la antijuridicidad, la culpabilidad, la capacidad de responsabilidad, las causas de justificación o exculpación y las pruebas. Las reglas concretas dependen de la jurisdicción y la fecha de los hechos.':'A general criminal-law analysis may cover the legal basis, offence elements, unlawfulness, culpability, capacity for responsibility, defenses, and evidence. The exact rules depend on jurisdiction and the date of the conduct.';
else if(/privacy|data|privasi|pelindungan|datos/i.test(q))answer=lang==='id'?'Untuk meninjau privasi data, petakan jenis data, tujuan dan dasar pemrosesan, pemberitahuan, pembatasan akses, keamanan, masa simpan, hak subjek data, serta mekanisme penanganan insiden. Periksa aturan yang berlaku pada yurisdiksi terkait.':lang==='es'?'Para revisar la privacidad, identifica los datos, la finalidad y base del tratamiento, los avisos, controles de acceso, seguridad, conservación, derechos de las personas y respuesta a incidentes. Comprueba las normas aplicables.':'For a privacy review, map the data types, purpose and legal basis, notices, access controls, security, retention, data-subject rights, and incident response. Check the rules applicable to the relevant jurisdiction.';
else answer=lang==='id'?'Saya dapat membantu menyusun kerangka riset, daftar isu, atau pertanyaan lanjutan. Agar analisis lebih relevan, sebutkan negara/yurisdiksi, bidang hukum, dan fakta yang tidak sensitif. Prototipe ini belum terhubung ke model AI atau basis data hukum langsung.':lang==='es'?'Puedo ayudarte a estructurar la investigación, identificar cuestiones y preparar preguntas de seguimiento. Indica la jurisdicción, el área jurídica y los hechos no sensibles. Este prototipo no está conectado a un modelo de IA ni a una base jurídica en tiempo real.':'I can help outline research, identify issues, or prepare follow-up questions. Specify the jurisdiction, legal area, and non-sensitive facts. This prototype is not connected to an AI model or live legal database.';
box.insertAdjacentHTML('beforeend',`<div class="message"><small>Fortunia AI · Demo</small>${esc(answer)}</div>`);input.value='';box.scrollTop=box.scrollHeight}
function showTopic(key){const details={contractLaw:'contractDesc',criminalLaw:'criminalDesc',dataProtection:'dataDesc',employmentLaw:'employmentDesc',companyLaw:'companyDesc',disputeResolution:'disputeDesc'};openModal(t('topicTitle')+': '+t(key),`<p>${t(details[key])}</p><div class="notice">${t('topicNote')}</div><div class="form-actions"><button class="btn primary" onclick="closeModal()">${t('close')}</button></div>`)}
function calculateFee(e){e.preventDefault();const rate=Math.max(0,+$('#rate').value),hours=Math.max(0,+$('#hours').value),costs=Math.max(0,+$('#costs').value),discount=Math.min(100,Math.max(0,+$('#discount').value)),base=rate*hours,disc=base*discount/100,total=base-disc+costs;const money=n=>new Intl.NumberFormat(lang==='id'?'id-ID':lang==='es'?'es-ES':'en-US',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);$('#feeResult').innerHTML=`<div class="card" style="margin-top:18px"><div class="eyebrow">${t('estimatedTotal')}</div><div class="stat-num">${money(total)}</div><p>${t('baseFee')}: <strong>${money(base)}</strong></p><p>${t('discountAmount')}: <strong>−${money(disc)}</strong></p><p>${t('totalCosts')}: <strong>${money(costs)}</strong></p></div>`}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navTo(b.dataset.page)});$('#languageSelect').addEventListener('change',e=>setLanguage(e.target.value));$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#themeBtn').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('fn_theme',document.body.classList.contains('light')?'light':'dark')});$('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value;const q=searchTerm.trim().toLowerCase();if(!q)return;currentPage='cases';render();const input=$('#caseFilter');if(input){input.value=q;filterCaseRows(q)}});
if(localStorage.getItem('fn_theme')==='light')document.body.classList.add('light');render();
</script>
</body>
</html>
